<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 448" width="1500" height="448" role="img" aria-label="Client Web Platforms — 8 live production websites across energy, electrical, generator, HVAC, automotive and industrial sectors">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="19" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.32  0 0 0 0 0.28  0 0 0 0.55 -0.12"/>
    </filter>
  </defs>
  <style>
    .serif { font-family: Georgia, 'Times New Roman', 'Liberation Serif', serif; }
    .mono  { font-family: Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace; }
  </style>

  <!-- paper -->
  <rect width="1500" height="448" fill="#e2ddd3"/>
  <rect width="1500" height="448" filter="url(#grain)" opacity="0.5"/>

  <!-- masthead -->
  <line x1="90" y1="42" x2="1410" y2="42" stroke="#181714" stroke-width="3"/>
  <text class="mono" x="90" y="75" font-size="16" letter-spacing="4" fill="#6f695e">— CLIENT INDEX · LIVE PLATFORMS</text>
  <text class="mono" x="1410" y="75" text-anchor="end" font-size="16" letter-spacing="3.5" fill="#6f695e">08 PRODUCTION SITES</text>
  <line x1="90" y1="92" x2="1410" y2="92" stroke="#55514a" stroke-width="1.4"/>

  <!-- center divider -->
  <line x1="750" y1="112" x2="750" y2="352" stroke="#d0cabf" stroke-width="1.6"/>

  <!-- left column rows -->
  <text class="serif" x="90" y="144" font-size="24" font-weight="700" fill="#181714">Cvspower</text>
  <text class="serif" x="714" y="144" text-anchor="end" font-size="19" font-style="italic" fill="#5c574e">Generators &amp; power systems</text>
  <line x1="90" y1="164" x2="714" y2="164" stroke="#d2ccc0" stroke-width="1.2"/>

  <text class="serif" x="90" y="206" font-size="24" font-weight="700" fill="#181714">Akan Enerji</text>
  <text class="serif" x="714" y="206" text-anchor="end" font-size="19" font-style="italic" fill="#5c574e">Energy</text>
  <line x1="90" y1="226" x2="714" y2="226" stroke="#d2ccc0" stroke-width="1.2"/>

  <text class="serif" x="90" y="268" font-size="24" font-weight="700" fill="#181714">Delfin Elektrik</text>
  <text class="serif" x="714" y="268" text-anchor="end" font-size="19" font-style="italic" fill="#5c574e">Electrical services</text>
  <line x1="90" y1="288" x2="714" y2="288" stroke="#d2ccc0" stroke-width="1.2"/>

  <text class="serif" x="90" y="330" font-size="24" font-weight="700" fill="#181714">Lidersan Elektrik</text>
  <text class="serif" x="714" y="330" text-anchor="end" font-size="19" font-style="italic" fill="#5c574e">Electrical services</text>

  <!-- right column rows -->
  <text class="serif" x="786" y="144" font-size="24" font-weight="700" fill="#181714">Acil Jeneratör Servisi</text>
  <text class="serif" x="1410" y="144" text-anchor="end" font-size="19" font-style="italic" fill="#5c574e">Generator service</text>
  <line x1="786" y1="164" x2="1410" y2="164" stroke="#d2ccc0" stroke-width="1.2"/>

  <text class="serif" x="786" y="206" font-size="24" font-weight="700" fill="#181714">KlimaServis</text>
  <text class="serif" x="1410" y="206" text-anchor="end" font-size="19" font-style="italic" fill="#5c574e">HVAC service</text>
  <line x1="786" y1="226" x2="1410" y2="226" stroke="#d2ccc0" stroke-width="1.2"/>

  <text class="serif" x="786" y="268" font-size="24" font-weight="700" fill="#181714">OtoServis</text>
  <text class="serif" x="1410" y="268" text-anchor="end" font-size="19" font-style="italic" fill="#5c574e">Automotive service</text>
  <line x1="786" y1="288" x2="1410" y2="288" stroke="#d2ccc0" stroke-width="1.2"/>

  <text class="serif" x="786" y="330" font-size="24" font-weight="700" fill="#181714">Erden Konveyör</text>
  <text class="serif" x="1410" y="330" text-anchor="end" font-size="19" font-style="italic" fill="#5c574e">Industrial conveyors</text>

  <!-- dark footer bar -->
  <rect x="0" y="378" width="1500" height="70" fill="#151412"/>
  <text class="mono" x="90" y="420" font-size="15" letter-spacing="2" fill="#f3efe6">NEXT.JS · REACT · TYPESCRIPT · TAILWIND · POSTGRESQL · SUPABASE</text>
  <text class="mono" x="1410" y="420" text-anchor="end" font-size="14" letter-spacing="2" fill="#b5ad9c">TECHNICAL SEO · GOOGLE APIS · ANALYTICS</text>
</svg>
