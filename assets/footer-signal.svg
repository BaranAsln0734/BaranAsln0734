<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 200" width="1500" height="200" role="img" aria-label="Building useful software with Safe Dijital — safedijital.com">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.32  0 0 0 0 0.28  0 0 0 0.55 -0.12"/>
    </filter>
  </defs>
  <style>
    .serif { font-family: Georgia, 'Times New Roman', 'Liberation Serif', serif; }
    .mono  { font-family: Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace; }
    .cur   { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cur { animation: none; } }
  </style>
  <rect width="1500" height="200" fill="#e2ddd3"/>
  <rect width="1500" height="200" filter="url(#grain)" opacity="0.5"/>
  <line x1="90" y1="40" x2="1408" y2="40" stroke="#181714" stroke-width="3"/>
  <text class="serif" x="750" y="108" text-anchor="middle" font-size="40" font-style="italic" fill="#181714">Building useful software with Safe Dijital.</text>
  <line x1="90" y1="140" x2="1408" y2="140" stroke="#55514a" stroke-width="1.6"/>
  <text class="mono" x="90" y="172" font-size="16" letter-spacing="3.5" fill="#6f695e">— END OF ISSUE</text>
  <text class="mono" x="1408" y="172" text-anchor="end" font-size="16" letter-spacing="3.5" fill="#6f695e">SAFEDIJITAL.COM<tspan class="cur"> ▍</tspan></text>
</svg>
