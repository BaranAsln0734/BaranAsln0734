<svg width="1200" height="520" viewBox="0 0 1200 520"
     fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- BACKGROUND -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520">
      <stop offset="0" stop-color="#050509"/>
      <stop offset="0.5" stop-color="#090914"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>

    <!-- GRID -->
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8B5CF6" stop-opacity=".12"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity=".25"/>
    </linearGradient>

    <!-- CYAN -->
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset=".5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>

    <!-- PURPLE -->
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C084FC"/>
      <stop offset=".5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>

    <!-- CORE -->
    <radialGradient id="core">
      <stop offset="0" stop-color="#E0F2FE" stop-opacity=".95"/>
      <stop offset=".15" stop-color="#67E8F9" stop-opacity=".8"/>
      <stop offset=".42" stop-color="#8B5CF6" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- GLASS -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".09"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".025"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity=".06"/>
    </linearGradient>

    <!-- GLOWS -->
    <filter id="glowCyan" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowPurple" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

    <!-- CLIP -->
    <clipPath id="canvas">
      <rect width="1200" height="520" rx="28"/>
    </clipPath>

    <!-- MASK -->
    <radialGradient id="fade">
      <stop offset="0" stop-color="white"/>
      <stop offset=".72" stop-color="white"/>
      <stop offset="1" stop-color="black"/>
    </radialGradient>

    <mask id="edgeFade">
      <rect width="1200" height="520" fill="url(#fade)"/>
    </mask>

  </defs>

  <!-- ====================================================== -->
  <!-- BACKGROUND -->
  <!-- ====================================================== -->

  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>

  <g clip-path="url(#canvas)" mask="url(#edgeFade)">

    <!-- atmospheric glows -->

    <circle cx="890" cy="230" r="170"
            fill="#7C3AED"
            opacity=".08"
            filter="url(#bigGlow)"/>

    <circle cx="780" cy="250" r="130"
            fill="#06B6D4"
            opacity=".07"
            filter="url(#bigGlow)"/>

    <!-- ================================================== -->
    <!-- PERSPECTIVE GRID -->
    <!-- ================================================== -->

    <g opacity=".45">

      <!-- horizontal perspective lines -->

      <path d="M420 330 H1200"
            stroke="url(#gridFade)"
            stroke-width="1"/>

      <path d="M390 350 H1200"
            stroke="url(#gridFade)"
            stroke-width="1"/>

      <path d="M350 375 H1200"
            stroke="url(#gridFade)"
            stroke-width="1"/>

      <path d="M300 405 H1200"
            stroke="url(#gridFade)"
            stroke-width="1"/>

      <path d="M240 440 H1200"
            stroke="url(#gridFade)"
            stroke-width="1"/>

      <path d="M150 485 H1200"
            stroke="url(#gridFade)"
            stroke-width="1"/>

      <!-- vertical perspective lines -->

      <path d="M470 320 L300 520"
            stroke="url(#gridFade)"
            stroke-width="1"/>

      <path d="M540 320 L455 520"
            stroke="url(#gridFade)"
            stroke-width="1"/>

      <path d="M610 320 L570 520"
            stroke="url(#gridFade)"
            stroke-width="1"/>

      <path d="M680 320 L680 520"
            stroke="url(#gridFade)"
            stroke-width="1"/>

      <path d="M750 320 L790 520"
            stroke="url(#gridFade)"
            stroke-width="1"/>

      <path d="M820 320 L900 520"
            stroke="url(#gridFade)"
            stroke-width="1"/>

      <path d="M890 320 L1040 520"
            stroke="url(#gridFade)"
            stroke-width="1"/>

      <path d="M960 320 L1180 520"
            stroke="url(#gridFade)"
            stroke-width="1"/>

    </g>

    <!-- ================================================== -->
    <!-- FLOATING PARTICLES -->
    <!-- ================================================== -->

    <g>

      <circle cx="710" cy="90" r="2" fill="#67E8F9">
        <animate attributeName="cy"
                 values="90;70;90"
                 dur="5s"
                 repeatCount="indefinite"/>
        <animate attributeName="opacity"
                 values=".2;.9;.2"
                 dur="5s"
                 repeatCount="indefinite"/>
      </circle>

      <circle cx="1020" cy="130" r="2" fill="#A78BFA">
        <animate attributeName="cy"
                 values="130;155;130"
                 dur="6s"
                 repeatCount="indefinite"/>
      </circle>

      <circle cx="1090" cy="290" r="1.5" fill="#22D3EE">
        <animate attributeName="cx"
                 values="1090;1070;1090"
                 dur="4s"
                 repeatCount="indefinite"/>
      </circle>

      <circle cx="640" cy="150" r="1.5" fill="#C084FC">
        <animate attributeName="cy"
                 values="150;170;150"
                 dur="7s"
                 repeatCount="indefinite"/>
      </circle>

    </g>

    <!-- ================================================== -->
    <!-- MAIN 3D CORE -->
    <!-- ================================================== -->

    <g transform="translate(820 235)">

      <!-- aura -->

      <circle r="115"
              fill="url(#core)"
              opacity=".25">
        <animate attributeName="r"
                 values="105;125;105"
                 dur="6s"
                 repeatCount="indefinite"/>
        <animate attributeName="opacity"
                 values=".18;.32;.18"
                 dur="6s"
                 repeatCount="indefinite"/>
      </circle>

      <!-- rotating outer orbit -->

      <ellipse rx="150" ry="55"
               transform="rotate(-18)"
               stroke="url(#purple)"
               stroke-width="1"
               stroke-opacity=".5">

        <animateTransform
          attributeName="transform"
          type="rotate"
          from="-18 0 0"
          to="342 0 0"
          dur="18s"
          repeatCount="indefinite"/>

      </ellipse>

      <ellipse rx="145" ry="48"
               transform="rotate(55)"
               stroke="url(#cyan)"
               stroke-width="1"
               stroke-opacity=".45">

        <animateTransform
          attributeName="transform"
          type="rotate"
          from="55 0 0"
          to="415 0 0"
          dur="14s"
          repeatCount="indefinite"/>

      </ellipse>

      <!-- wireframe sphere -->

      <g opacity=".9">

        <ellipse rx="88" ry="88"
                 stroke="url(#cyan)"
                 stroke-width="1.5"
                 stroke-opacity=".65"/>

        <ellipse rx="88" ry="40"
                 stroke="url(#purple)"
                 stroke-width="1.2"
                 stroke-opacity=".7"/>

        <ellipse rx="88" ry="18"
                 stroke="url(#cyan)"
                 stroke-width="1"
                 stroke-opacity=".5"/>

        <ellipse rx="40" ry="88"
                 stroke="url(#purple)"
                 stroke-width="1.2"
                 stroke-opacity=".6"
                 transform="rotate(25)"/>

        <ellipse rx="18" ry="88"
                 stroke="url(#cyan)"
                 stroke-width="1"
                 stroke-opacity=".45"
                 transform="rotate(25)"/>

      </g>

      <!-- core -->

      <circle r="34"
              fill="url(#core)"
              opacity=".9"
              filter="url(#glowPurple)">
        <animate attributeName="r"
                 values="30;38;30"
                 dur="4s"
                 repeatCount="indefinite"/>
      </circle>

      <circle r="8"
              fill="#E0F2FE"
              filter="url(#glowCyan)">
        <animate attributeName="r"
                 values="6;10;6"
                 dur="3s"
                 repeatCount="indefinite"/>
      </circle>

      <!-- orbiting nodes -->

      <g>

        <circle cx="150" cy="0" r="5"
                fill="#67E8F9"
                filter="url(#glowCyan)">

          <animateTransform
            attributeName="transform"
            type="rotate"
            from="0"
            to="360"
            dur="10s"
            repeatCount="indefinite"/>

        </circle>

        <circle cx="-145" cy="0" r="4"
                fill="#A78BFA"
                filter="url(#glowPurple)">

          <animateTransform
            attributeName="transform"
            type="rotate"
            from="180"
            to="-180"
            dur="13s"
            repeatCount="indefinite"/>

        </circle>

      </g>

    </g>

    <!-- ================================================== -->
    <!-- DATA FLOW LINES -->
    <!-- ================================================== -->

    <g stroke-linecap="round">

      <path d="M580 180 C650 180 690 210 750 225"
            stroke="#22D3EE"
            stroke-opacity=".22"
            stroke-width="1"/>

      <path d="M590 280 C670 280 700 250 750 245"
            stroke="#8B5CF6"
            stroke-opacity=".22"
            stroke-width="1"/>

      <path d="M900 235 C950 210 990 190 1060 190"
            stroke="#22D3EE"
            stroke-opacity=".22"
            stroke-width="1"/>

      <!-- animated packets -->

      <circle r="3" fill="#67E8F9" filter="url(#glowCyan)">
        <animateMotion
          path="M580 180 C650 180 690 210 750 225"
          dur="3s"
          repeatCount="indefinite"/>
      </circle>

      <circle r="3" fill="#A78BFA" filter="url(#glowPurple)">
        <animateMotion
          path="M590 280 C670 280 700 250 750 245"
          dur="4s"
          repeatCount="indefinite"/>
      </circle>

      <circle r="3" fill="#67E8F9" filter="url(#glowCyan)">
        <animateMotion
          path="M900 235 C950 210 990 190 1060 190"
          dur="3.5s"
          repeatCount="indefinite"/>
      </circle>

    </g>

    <!-- ================================================== -->
    <!-- ARCHITECTURE LABELS -->
    <!-- ================================================== -->

    <g font-family="Inter, Arial, sans-serif">

      <!-- frontend -->

      <g transform="translate(520 145)">

        <rect width="120" height="46" rx="12"
              fill="url(#glass)"
              stroke="#67E8F9"
              stroke-opacity=".22"/>

        <circle cx="18" cy="23" r="4"
                fill="#22D3EE"
                filter="url(#glowCyan)"/>

        <text x="31" y="20"
              fill="#E5E7EB"
              font-size="11"
              font-weight="600">
          FRONTEND
        </text>

        <text x="31" y="34"
              fill="#64748B"
              font-size="8">
          React · Next.js
        </text>

      </g>

      <!-- backend -->

      <g transform="translate(520 265)">

        <rect width="120" height="46" rx="12"
              fill="url(#glass)"
              stroke="#A78BFA"
              stroke-opacity=".22"/>

        <circle cx="18" cy="23" r="4"
                fill="#8B5CF6"
                filter="url(#glowPurple)"/>

        <text x="31" y="20"
              fill="#E5E7EB"
              font-size="11"
              font-weight="600">
          BACKEND
        </text>

        <text x="31" y="34"
              fill="#64748B"
              font-size="8">
          Node · APIs
        </text>

      </g>

      <!-- database -->

      <g transform="translate(1035 165)">

        <rect width="120" height="46" rx="12"
              fill="url(#glass)"
              stroke="#22D3EE"
              stroke-opacity=".22"/>

        <circle cx="18" cy="23" r="4"
                fill="#22D3EE"
                filter="url(#glowCyan)"/>

        <text x="31" y="20"
              fill="#E5E7EB"
              font-size="11"
              font-weight="600">
          DATA
        </text>

        <text x="31" y="34"
              fill="#64748B"
              font-size="8">
          PostgreSQL · ML
        </text>

      </g>

    </g>

    <!-- ================================================== -->
    <!-- LEFT SIDE IDENTITY -->
    <!-- ================================================== -->

    <g font-family="Inter, Arial, sans-serif">

      <text x="80" y="105"
            fill="#64748B"
            font-size="11"
            letter-spacing="4">
        SOFTWARE ENGINEERING / 01
      </text>

      <text x="80" y="160"
            fill="#FFFFFF"
            font-size="42"
            font-weight="700"
            letter-spacing="-1.5">
        VELİ BARAN
      </text>

      <text x="80" y="208"
            fill="#FFFFFF"
            font-size="42"
            font-weight="700"
            letter-spacing="-1.5">
        ASLAN
      </text>

      <text x="82" y="246"
            fill="#94A3B8"
            font-size="14">
        Full-Stack Developer · SaaS Builder
      </text>

      <text x="82" y="268"
            fill="#64748B"
            font-size="12">
        Business Systems · Data · AI · Automation
      </text>

      <!-- status -->

      <g transform="translate(82 310)">

        <rect width="150" height="32"
              rx="16"
              fill="#0B1220"
              stroke="#22D3EE"
              stroke-opacity=".2"/>

        <circle cx="18" cy="16" r="4"
                fill="#22D3EE"
                filter="url(#glowCyan)">
          <animate attributeName="opacity"
                   values=".4;1;.4"
                   dur="2s"
                   repeatCount="indefinite"/>
        </circle>

        <text x="31" y="20"
              fill="#CBD5E1"
              font-size="10"
              letter-spacing=".5">
          BUILDING SYSTEMS
        </text>

      </g>

      <!-- mini terminal -->

      <g transform="translate(80 385)">

        <rect width="330" height="68"
              rx="14"
              fill="#08080D"
              stroke="#FFFFFF"
              stroke-opacity=".08"/>

        <circle cx="18" cy="18" r="4" fill="#334155"/>
        <circle cx="31" cy="18" r="4" fill="#334155"/>
        <circle cx="44" cy="18" r="4" fill="#334155"/>

        <text x="20" y="44"
              fill="#64748B"
              font-size="10"
              font-family="monospace">
          $ build --systems --ship --improve
        </text>

        <text x="20" y="59"
              fill="#22D3EE"
              font-size="9"
              font-family="monospace">
          ✓ production ready
        </text>

      </g>

    </g>

  </g>

  <!-- border -->

  <rect x=".75" y=".75"
        width="1198.5"
        height="518.5"
        rx="28"
        stroke="#FFFFFF"
        stroke-opacity=".08"
        stroke-width="1.5"/>

</svg>
