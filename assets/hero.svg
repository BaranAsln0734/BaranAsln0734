    <path d="M0 240H1200"/>
    <path d="M0 320H1200"/>

    <path d="M100 0V400"/>
    <path d="M200 0V400"/>
    <path d="M300 0V400"/>
    <path d="M400 0V400"/>
    <path d="M500 0V400"/>
    <path d="M600 0V400"/>
    <path d="M700 0V400"/>
    <path d="M800 0V400"/>
    <path d="M900 0V400"/>
    <path d="M1000 0V400"/>
    <path d="M1100 0V400"/>
