<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1500 525" width="1500" height="525" role="img" aria-label="The Profile — Veli Baran Aslan, software developer, full-stack builder, SaaS builder">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.32  0 0 0 0 0.28  0 0 0 0.55 -0.12"/>
    </filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <style>
    .serif { font-family: Georgia, 'Times New Roman', 'Liberation Serif', serif; }
    .mono  { font-family: Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace; }
    .logo  { transform-box: fill-box; transform-origin: center; animation: spin 6s infinite; }
    .shade { transform-box: fill-box; transform-origin: center; animation: spin 6s infinite, shade 6s infinite; }
    .cur   { animation: blink 1s steps(1) infinite; }
    @keyframes spin {
      0.00% { transform: scaleX(1.0000); }
      1.67% { transform: scaleX(0.9995); }
      3.33% { transform: scaleX(0.9924); }
      5.00% { transform: scaleX(0.9638); }
      6.67% { transform: scaleX(0.8936); }
      8.33% { transform: scaleX(0.7619); }
      10.00% { transform: scaleX(0.5556); }
      11.67% { transform: scaleX(0.2755); }
      13.33% { transform: scaleX(0.0581); }
      15.00% { transform: scaleX(0.4052); }
      16.67% { transform: scaleX(0.7122); }
      18.33% { transform: scaleX(0.9242); }
      20.00% { transform: scaleX(1.0000); }
      21.67% { transform: scaleX(0.9242); }
      23.33% { transform: scaleX(0.7122); }
      25.00% { transform: scaleX(0.4052); }
      26.67% { transform: scaleX(0.0581); }
      28.33% { transform: scaleX(0.2755); }
      30.00% { transform: scaleX(0.5556); }
      31.67% { transform: scaleX(0.7619); }
      33.33% { transform: scaleX(0.8936); }
      35.00% { transform: scaleX(0.9638); }
      36.67% { transform: scaleX(0.9924); }
      38.33% { transform: scaleX(0.9995); }
      40.00% { transform: scaleX(1.0000); }
      100% { transform: scaleX(1); }
    }
    @keyframes shade {
      0.00% { opacity: 0.000; }
      1.67% { opacity: 0.000; }
      3.33% { opacity: 0.004; }
      5.00% { opacity: 0.018; }
      6.67% { opacity: 0.053; }
      8.33% { opacity: 0.119; }
      10.00% { opacity: 0.222; }
      11.67% { opacity: 0.362; }
      13.33% { opacity: 0.471; }
      15.00% { opacity: 0.297; }
      16.67% { opacity: 0.144; }
      18.33% { opacity: 0.038; }
      20.00% { opacity: 0.000; }
      21.67% { opacity: 0.038; }
      23.33% { opacity: 0.144; }
      25.00% { opacity: 0.297; }
      26.67% { opacity: 0.471; }
      28.33% { opacity: 0.362; }
      30.00% { opacity: 0.222; }
      31.67% { opacity: 0.119; }
      33.33% { opacity: 0.053; }
      35.00% { opacity: 0.018; }
      36.67% { opacity: 0.004; }
      38.33% { opacity: 0.000; }
      40.00% { opacity: 0.000; }
      100% { opacity: 0; }
    }
    @keyframes blink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .logo, .shade, .cur { animation: none; }
    }
  </style>

  <!-- paper -->
  <rect width="1500" height="525" fill="#e2ddd3"/>
  <rect width="1500" height="525" filter="url(#grain)" opacity="0.5"/>

  <!-- masthead -->
  <line x1="90" y1="50" x2="1408" y2="50" stroke="#181714" stroke-width="4"/>
  <text class="serif" x="90" y="87" font-size="27" font-weight="700" letter-spacing="7" fill="#181714">THE PROFILE</text>
  <text class="mono" x="1408" y="86" text-anchor="end" font-size="16" letter-spacing="3.5" fill="#6f695e">VOL. 01 · MMXXVI · ISTANBUL</text>
  <line x1="90" y1="104" x2="1408" y2="104" stroke="#55514a" stroke-width="1.6"/>

  <!-- name -->
  <text class="serif" x="88" y="205" font-size="86" font-weight="700" letter-spacing="-2" fill="#181714">Veli Baran Aslan</text>
  <text class="serif" x="90" y="250" font-size="29" font-style="italic" fill="#4a463f">software developer · full-stack builder · saas builder</text>

  <!-- spinning logo -->
  <g filter="url(#drop)">
    <g class="logo"><image x="1278" y="128" width="130" height="130" xlink:href="data:image/png;base64,"/></g>
    <rect class="shade" x="1278" y="128" width="130" height="130" rx="30" fill="#000" opacity="0"/>
  </g>

  <line x1="90" y1="280" x2="1408" y2="280" stroke="#d2ccc0" stroke-width="1.6"/>

  <!-- column dividers -->
  <line x1="514" y1="306" x2="514" y2="460" stroke="#d0cabf" stroke-width="1.6"/>
  <line x1="939" y1="306" x2="939" y2="460" stroke="#d0cabf" stroke-width="1.6"/>

  <!-- col 1 -->
  <text class="mono" x="90" y="328" font-size="16" letter-spacing="4" fill="#6f695e">— SELECTED WORK</text>
  <text class="serif" x="90" y="366" font-size="25" font-weight="700" fill="#181714">Cvspower</text>
  <text class="serif" x="90" y="397" font-size="25" font-weight="700" fill="#181714">Safe Dijital · SafeServis</text>
  <text class="serif" x="90" y="428" font-size="25" font-weight="700" fill="#181714">Churn Prediction</text>
  <text class="serif" x="90" y="457" font-size="22" font-style="italic" fill="#5c574e">and eight client platforms, live</text>

  <!-- col 2 -->
  <text class="mono" x="564" y="328" font-size="16" letter-spacing="4" fill="#6f695e">— STACK</text>
  <text class="serif" x="564" y="366" font-size="24" fill="#181714">TypeScript · React · Next.js</text>
  <text class="serif" x="564" y="397" font-size="24" fill="#181714">Node.js · Express · FastAPI</text>
  <text class="serif" x="564" y="428" font-size="24" fill="#181714">PostgreSQL · Prisma · Supabase</text>
  <text class="serif" x="564" y="457" font-size="22" font-style="italic" fill="#5c574e">python, pandas, scikit-learn</text>

  <!-- col 3 -->
  <rect x="989" y="305" width="419" height="114" fill="#151412"/>
  <text class="mono" x="1013" y="341" font-size="16" letter-spacing="4" fill="#b5ad9c">— NOW</text>
  <text class="serif" x="1013" y="378" font-size="27" font-style="italic" fill="#f3efe6">building real business software.</text>
  <text class="mono" x="1013" y="404" font-size="16" letter-spacing="1.5" fill="#b5ad9c">— safe dijital<tspan class="cur"> ▍</tspan></text>
  <text class="serif" x="989" y="457" font-size="24" fill="#181714">safedijital.com</text>

  <!-- footer -->
  <line x1="90" y1="482" x2="1408" y2="482" stroke="#181714" stroke-width="3"/>
  <text class="mono" x="90" y="511" font-size="16" letter-spacing="3.5" fill="#6f695e">ISTANBUL · TÜRKİYE</text>
  <text class="mono" x="1408" y="511" text-anchor="end" font-size="16" letter-spacing="3.5" fill="#6f695e">BUILD · SHIP · IMPROVE</text>
</svg>
