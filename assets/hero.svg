<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" fill="none">
<title>Veli Baran Aslan — Safe Dijital</title>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="390"><stop stop-color="#070B08"/><stop offset=".55" stop-color="#0B120D"/><stop offset="1" stop-color="#050806"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#39D353" stop-opacity=".19"/><stop offset="1" stop-color="#39D353" stop-opacity="0"/></radialGradient>
 <linearGradient id="line" x1="0" x2="1"><stop stop-color="#39D353" stop-opacity="0"/><stop offset=".5" stop-color="#39D353"/><stop offset="1" stop-color="#39D353" stop-opacity="0"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#8BE99A" stroke-opacity=".055"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
 <style>
 .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
 .sans{font-family:Inter,Arial,sans-serif}
 .scan{animation:scan 8s ease-in-out infinite}
 .dash{stroke-dasharray:8 16;animation:dash 18s linear infinite}
 .pulse{animation:pulse 3.8s ease-in-out infinite}
 .float{animation:float 7s ease-in-out infinite}
 @keyframes dash{to{stroke-dashoffset:-480}}
 @keyframes scan{0%,100%{transform:translateX(-360px);opacity:.04}50%{transform:translateX(1250px);opacity:.22}}
 @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
 </style>
</defs>
<rect width="1200" height="390" rx="22" fill="url(#bg)"/><rect width="1200" height="390" rx="22" fill="url(#grid)"/>
<circle cx="1030" cy="175" r="270" fill="url(#halo)" filter="url(#blur)"/>
<path d="M0 320H1200" stroke="#39D353" stroke-opacity=".14"/>
<rect class="scan" x="0" y="0" width="260" height="390" fill="url(#line)" opacity=".18"/>
<path class="dash" d="M520 292C660 292 662 225 790 225S922 282 1045 190 1115 120 1200 120" stroke="#39D353" stroke-width="1.6" opacity=".55"/>
<g class="mono" fill="#39D353" font-size="12" letter-spacing="2.2"><text x="68" y="62">INDEPENDENT SOFTWARE ENGINEERING</text><text x="68" y="344" fill="#718275" font-size="10">ISTANBUL · TURKEY</text><text x="1128" y="344" text-anchor="end" fill="#718275" font-size="10">BUILD / SHIP / IMPROVE</text></g>
<text x="68" y="148" class="sans" fill="#F0F6FC" font-size="56" font-weight="750" letter-spacing="-2">VELİ BARAN ASLAN</text>
<text x="70" y="190" class="mono" fill="#A9B8AC" font-size="19">Software Developer <tspan fill="#39D353">/</tspan> SaaS Builder <tspan fill="#39D353">/</tspan> Data &amp; AI</text>
<path d="M70 222H470" stroke="#263C2B"/><path d="M70 222H196" stroke="#39D353" stroke-width="2"/>
<text x="70" y="260" class="sans" fill="#D3DDD5" font-size="18">Engineering business software that solves real operational problems.</text>
<text x="70" y="288" class="sans" fill="#7F9182" font-size="15">Founder-minded builder at <tspan fill="#8CF99B" font-weight="700">SAFE DIJITAL</tspan></text>
<g class="float">
 <circle cx="1010" cy="184" r="105" fill="#0A120C" stroke="#39D353" stroke-opacity=".38"/>
 <circle cx="1010" cy="184" r="88" stroke="#39D353" stroke-opacity=".18" stroke-dasharray="2 7"/>
 <image x="938" y="112" width="144" height="144" href="data:image/png;base64,"/>
 <circle class="pulse" cx="1090" cy="111" r="5" fill="#39D353"/>
</g>
<g transform="translate(825 305)" class="mono" font-size="10" fill="#9BB19E"><rect width="370" height="38" rx="8" fill="#0A120C" stroke="#294C31"/><circle cx="18" cy="19" r="3" fill="#39D353"/><text x="32" y="23">SAFE DIJITAL</text><text x="350" y="23" text-anchor="end" fill="#39D353">SYSTEMS IN PROGRESS</text></g>
<rect x=".75" y=".75" width="1198.5" height="388.5" rx="21.25" stroke="#39D353" stroke-opacity=".18"/>
</svg>