<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="560" height="260" role="img" aria-label="No. 04 — SafeTakip, process and status tracking">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="15" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.32  0 0 0 0 0.28  0 0 0 0.55 -0.12"/>
    </filter>
  </defs>
  <style>
    .serif { font-family: Georgia, 'Times New Roman', 'Liberation Serif', serif; }
    .mono  { font-family: Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace; }
  </style>

  <!-- paper -->
  <rect width="560" height="260" fill="#e2ddd3"/>
  <rect width="560" height="260" filter="url(#grain)" opacity="0.5"/>

  <!-- masthead -->
  <line x1="30" y1="30" x2="530" y2="30" stroke="#181714" stroke-width="3"/>
  <text class="mono" x="30" y="58" font-size="15" letter-spacing="3" fill="#6f695e">TRACKING &amp; WORKFLOW</text>
  <text class="serif" x="530" y="58" text-anchor="end" font-size="19" font-style="italic" fill="#6f695e">No. 04</text>
  <line x1="30" y1="72" x2="530" y2="72" stroke="#55514a" stroke-width="1.2"/>

  <!-- minimal editorial timeline / status tracker emblem -->
  <g transform="translate(458, 96)" fill="none" stroke="#181714" stroke-width="1.6" opacity="0.55">
    <line x1="12" y1="12" x2="12" y2="70" stroke="#6f695e"/>
    <circle cx="12" cy="12" r="5" fill="#181714"/>
    <circle cx="12" cy="41" r="5" fill="#181714"/>
    <circle cx="12" cy="70" r="5" fill="#e2ddd3"/>
    <line x1="28" y1="12" x2="68" y2="12"/>
    <line x1="28" y1="41" x2="60" y2="41"/>
    <line x1="28" y1="70" x2="52" y2="70" stroke-opacity="0.6"/>
  </g>

  <!-- title & copy -->
  <text class="serif" x="28" y="126" font-size="44" font-weight="700" letter-spacing="-1" fill="#181714">SafeTakip</text>
  <text class="serif" x="30" y="162" font-size="21" font-style="italic" fill="#4a463f">process, task and status tracking.</text>
  <text class="serif" x="30" y="192" font-size="18" fill="#181714">Real-time updates · notifications · team visibility</text>

  <!-- dark footer bar -->
  <rect x="0" y="214" width="560" height="46" fill="#151412"/>
  <text class="mono" x="30" y="243" font-size="14" letter-spacing="2.5" fill="#b5ad9c">TRACKING / AUTOMATION</text>
  <text class="mono" x="530" y="243" text-anchor="end" font-size="14" letter-spacing="2.5" fill="#f3efe6">SAFE DIJITAL</text>
</svg>
