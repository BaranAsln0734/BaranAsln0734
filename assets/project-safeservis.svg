<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="560" height="260" role="img" aria-label="No. 01 — SafeServis, field service and work-order platform">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="10" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.32  0 0 0 0 0.28  0 0 0 0.55 -0.12"/>
    </filter>
  </defs>
  <style>
    .serif { font-family: Georgia, 'Times New Roman', 'Liberation Serif', serif; }
    .mono  { font-family: Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace; }
  </style>

  <!-- paper -->
  <rect width="560" height="260" fill="#e2ddd3"/>
  <rect width="560" height="260" filter="url(#grain)" opacity="0.5"/>

  <!-- masthead -->
  <line x1="30" y1="30" x2="530" y2="30" stroke="#181714" stroke-width="3"/>
  <text class="mono" x="30" y="58" font-size="15" letter-spacing="3" fill="#6f695e">FLAGSHIP · FIELD SERVICE</text>
  <text class="serif" x="530" y="58" text-anchor="end" font-size="19" font-style="italic" fill="#6f695e">No. 01</text>
  <line x1="30" y1="72" x2="530" y2="72" stroke="#55514a" stroke-width="1.2"/>

  <!-- minimal editorial QR / service grid emblem -->
  <g transform="translate(454, 96)" fill="none" stroke="#181714" stroke-width="1.6" opacity="0.55">
    <rect x="0" y="0" width="76" height="76" rx="4" stroke="#6f695e"/>
    <rect x="12" y="12" width="18" height="18" rx="1"/>
    <rect x="46" y="12" width="18" height="18" rx="1"/>
    <rect x="12" y="46" width="18" height="18" rx="1"/>
    <rect x="46" y="46" width="8" height="8" fill="#181714" stroke="none"/>
    <rect x="58" y="46" width="6" height="18" fill="#181714" stroke="none"/>
    <rect x="46" y="58" width="8" height="6" fill="#181714" stroke="none"/>
  </g>

  <!-- title & copy -->
  <text class="serif" x="28" y="126" font-size="44" font-weight="700" letter-spacing="-1" fill="#181714">SafeServis</text>
  <text class="serif" x="30" y="162" font-size="21" font-style="italic" fill="#4a463f">work orders, QR, maps &amp; PDF reports.</text>
  <text class="serif" x="30" y="192" font-size="18" fill="#181714">Web &amp; Android · live in production for Cvspower</text>

  <!-- dark footer bar -->
  <rect x="0" y="214" width="560" height="46" fill="#151412"/>
  <text class="mono" x="30" y="243" font-size="14" letter-spacing="2.5" fill="#b5ad9c">REACT / NODE / CAPACITOR</text>
  <text class="mono" x="530" y="243" text-anchor="end" font-size="14" letter-spacing="2.5" fill="#f3efe6">SAFE DIJITAL</text>
</svg>
